spring:
  application:
    base_operator:
      seeder:
        enable: false #disabled by default
      username: #fill in with secured values for production use
      password:
    security:
      jwt:
        issuer: '' #fill in for production use
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${PROD_DATABASE_URL}
    username: ${PROD_DATABASE_USERNAME}
    password: ${PROD_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    'io.github.khaytul_illia.inventory_manager_api': INFO